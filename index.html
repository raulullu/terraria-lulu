<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraria Lulu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Terraria Lulu</h1>
    <p>Meu assistente para organizar minhas aventuras no Terraria.</p>
    <h2>Meu Inventário</h2>
    <p id="total-itens">Total de itens: 0</p>
<label for="nome-item">Nome do item:</label>
<input id="nome-item" type="text" placeholder="Ex.: Espelho Mágico">
<label for="quantidade-item">Quantidade:</label>
<input id="quantidade-item" type="number" min="1" step="1" value="1">
<label for="categoria-item">Categoria:</label>
<select id="categoria-item">
    <option value="outros">Outros</option>
    <option value="materiais">Materiais</option>
    <option value="armas">Armas</option>
    <option value="acessorios">Acessórios</option>
    <option value="armaduras">Armaduras</option>
    <option value="consumiveis">Consumíveis</option>
</select>
<button id="adicionar-item" type="button">Adicionar item</button>
<button id="remover-ultimo" type="button">Remover último item</button>
<label for="ordem-itens">Ordem:</label>
<select id="ordem-itens">
    <option value="az">A a Z</option>
    <option value="za">Z a A</option>
    <option value="quantidade">Maior quantidade</option>
    <option value="menor-quantidade">Menor quantidade</option>
</select>

<button id="ordenar-itens" type="button">Ordenar itens</button>
<button id="exportar-itens" type="button">Exportar inventário</button>
<p>
    <label for="importar-itens">Importar inventário:</label>
    <input id="importar-itens" type="file" accept=".json">
</p>
    <p id="mensagem-item" role="status"></p>
    <p>
    <label for="buscar-item">Buscar no inventário:</label>
    <input id="buscar-item" type="text" placeholder="Ex.: Botas">
    </p>
    <p>
    <label for="filtrar-categoria">Filtrar por categoria:</label>
    <select id="filtrar-categoria">
        <option value="todas">Todas</option>
        <option value="outros">Outros</option>
        <option value="materiais">Materiais</option>
        <option value="armas">Armas</option>
        <option value="acessorios">Acessórios</option>
        <option value="armaduras">Armaduras</option>
        <option value="consumiveis">Consumíveis</option>
    </select>
    <button id="limpar-filtros" type="button">Limpar filtros</button>
</p>
    <ul id="lista-itens"></ul>
    <p id="mensagem-busca" role="status"></p>
    <script src="script.js"></script>
</body>

</html>
